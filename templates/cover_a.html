<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 900px; height: 383px; overflow: hidden;
         font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
         -webkit-font-smoothing: antialiased; }

  /* 论文解读封面 A「看点分栏」：左边一句结论，右边三条看点。
     三条看点直接取 front matter 的 highlights，不额外写字。 */
  .stage { position: relative; width: 900px; height: 383px;
           background: linear-gradient(150deg, #070d19 0%, #0a1526 48%, #0b1b2f 100%); }
  .stage::before { content: ""; position: absolute; right: -120px; top: -180px;
                   width: 520px; height: 520px; border-radius: 50%;
                   background: radial-gradient(circle, {{accent}} 0%, transparent 66%);
                   opacity: .20; }

  .card { position: absolute; inset: 16px; border-radius: 26px; overflow: hidden;
          background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.025));
          border: 1px solid rgba(255,255,255,.11);
          box-shadow: inset 0 1px 0 rgba(255,255,255,.15),
                      0 18px 44px rgba(0,0,0,.42), 0 40px 90px rgba(0,0,0,.30);
          display: flex; flex-direction: column; }

  .band { position: relative; flex-shrink: 0; height: 62px;
          background: linear-gradient(100deg, {{accent}} 0%, {{accent}} 66%, #ffffff 240%);
          display: flex; align-items: center; gap: 12px; padding: 0 34px 0 30px; }
  .band .logo { width: 30px; height: 30px; border-radius: 9px; background: rgba(8,17,31,.88);
                display: flex; align-items: center; justify-content: center;
                color: #fff; font-size: 16px; font-weight: 700; }
  .band .name { color: #0a1220; font-size: 17px; letter-spacing: 2.5px; font-weight: 700; }
  .band .kind { margin-left: auto; color: #0a1220; font-size: 21px; font-weight: 800;
                letter-spacing: 6px; }
  .band .kind::before { content: ""; display: inline-block; width: 8px; height: 8px;
                        border-radius: 50%; background: #0a1220; opacity: .5;
                        margin-right: 12px; vertical-align: 3px; }

  .body { position: relative; flex: 1; padding: 26px 36px 22px 40px; display: flex; gap: 26px; }
  .body::before { content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 42px 42px;
    -webkit-mask-image: radial-gradient(120% 120% at 100% 0%, #000 0%, transparent 60%); }
  .chain { position: absolute; right: -58px; bottom: -34px; width: 236px; height: 144px;
           opacity: .10; }

  .left { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column;
          justify-content: space-between; }
  .title { color: #ffffff; font-size: {{title_size}}px; font-weight: 700; line-height: 1.3;
           letter-spacing: .5px;
           display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
           overflow: hidden; }
  .kicker { width: 44px; height: 6px; border-radius: 3px; background: {{accent}};
            margin-top: 14px; }
  .venue { align-self: flex-start; color: #0a1220; font-weight: 700; font-size: 20px;
           background: {{accent}}; padding: 8px 19px; border-radius: 999px;
           letter-spacing: 1.2px; white-space: nowrap; }
  .venue:empty { display: none; }

  .right { position: relative; z-index: 1; flex-shrink: 0; width: 306px; padding-left: 26px;
           border-left: 1px solid rgba(255,255,255,.13);
           display: flex; flex-direction: column; justify-content: center; gap: 20px; }
  .hl { display: flex; align-items: flex-start; gap: 11px; color: #e6eef8; font-size: {{hl_size}}px;
        font-weight: 600; line-height: 1.3; }
  .hl:empty { display: none; }
  .hl i { width: 9px; height: 9px; border-radius: 50%; background: {{accent}};
          flex-shrink: 0; display: block; margin-top: 9px; }
</style>
</head>
<body>
<div class="stage">
  <div class="card">
    <div class="band">
      <div class="logo">链</div>
      <div class="name">供应链安全前沿</div>
      <div class="kind">{{kind_label}}</div>
    </div>
    <div class="body">
      <svg class="chain" viewBox="0 0 120 70" xmlns="http://www.w3.org/2000/svg">
        <g fill="none" stroke="{{accent}}" stroke-width="4" stroke-linecap="round">
          <rect x="4"  y="14" width="40" height="22" rx="11"/>
          <rect x="34" y="14" width="40" height="22" rx="11"/>
          <rect x="64" y="14" width="40" height="22" rx="11"/>
          <rect x="19" y="42" width="40" height="22" rx="11"/>
          <rect x="49" y="42" width="40" height="22" rx="11"/>
          <rect x="79" y="42" width="40" height="22" rx="11"/>
        </g>
      </svg>
      <div class="left">
        <div>
          <div class="title">{{title_zh}}</div>
          <div class="kicker"></div>
        </div>
        <div class="venue">{{venue}}</div>
      </div>
      <div class="right">
        <div class="hl"><i></i>{{h1}}</div>
        <div class="hl"><i></i>{{h2}}</div>
        <div class="hl"><i></i>{{h3}}</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
