<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 900px; height: 383px; overflow: hidden;
         font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
         -webkit-font-smoothing: antialiased; }

  /* 会议报告封面 B（听会笔记）：米白纸感底 + 白卡 + 左侧竖排色条，
     调性比 A 更"手记"，同样全圆角、有层次阴影。 */
  .stage { position: relative; width: 900px; height: 383px;
           background: linear-gradient(150deg, #faf6ef 0%, #f6efe4 100%); }
  /* 纸的横线纹，往右淡出 */
  .stage::before { content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(146, 116, 77, .10) 1px, transparent 1px);
    background-size: 100% 30px;
    -webkit-mask-image: linear-gradient(90deg, #000 0%, transparent 55%); }
  .stage::after { content: ""; position: absolute; right: -100px; top: -160px;
    width: 440px; height: 440px; border-radius: 50%;
    background: radial-gradient(circle, {{accent}} 0%, transparent 68%); opacity: .14; }

  .card { position: absolute; inset: 16px; border-radius: 26px; overflow: hidden;
          background: #fffdf9;
          border: 1px solid rgba(120, 92, 56, .12);
          box-shadow: 0 1px 2px rgba(90, 66, 36, .05),
                      0 10px 24px rgba(90, 66, 36, .10),
                      0 30px 60px rgba(90, 66, 36, .07);
          display: flex; }

  /* 左侧竖排标签条 */
  .strip { position: relative; flex-shrink: 0; width: 78px;
           background: linear-gradient(180deg, {{accent}} 0%, #3730a3 100%);
           display: flex; flex-direction: column; align-items: center;
           justify-content: center; gap: 16px; }
  .strip .dot { width: 10px; height: 10px; border-radius: 50%; background: #fff;
                box-shadow: 0 0 0 5px rgba(255, 255, 255, .22); }
  .strip .vtag { writing-mode: vertical-rl; color: #fff; font-size: 23px;
                 font-weight: 700; letter-spacing: 9px; text-indent: 9px; }
  .strip .seam { position: absolute; right: 0; top: 26px; bottom: 26px; width: 2px;
                 background: rgba(255, 255, 255, .22); border-radius: 2px; }

  .body { position: relative; flex: 1; padding: 30px 38px 26px 34px;
          display: flex; flex-direction: column; justify-content: space-between; }
  /* 右上斜角色块，圆角处理过，不扎眼 */
  .ribbon { position: absolute; right: -110px; top: -128px; width: 320px; height: 186px;
            border-radius: 46px; background: {{accent}}; opacity: .10;
            transform: rotate(26deg); }
  .ribbon2 { position: absolute; right: -136px; top: -78px; width: 320px; height: 76px;
             border-radius: 38px; background: {{accent}}; opacity: .18;
             transform: rotate(26deg); }
  /* 卡内也铺一层横线纹，笔记感才立得住 */
  .body::before { content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(146, 116, 77, .13) 1px, transparent 1px);
    background-size: 100% 30px;
    -webkit-mask-image: linear-gradient(100deg, #000 0%, rgba(0,0,0,.35) 46%, transparent 72%); }

  .row { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; }
  .logo { width: 32px; height: 32px; border-radius: 10px;
          background: linear-gradient(135deg, #36d399, #0ea5e9);
          display: flex; align-items: center; justify-content: center;
          color: #fff; font-size: 17px; font-weight: 700;
          box-shadow: 0 4px 10px rgba(14, 165, 233, .26); }
  .name { color: #6b573c; font-size: 17px; letter-spacing: 2.5px; font-weight: 500; }
  .eyebrow { margin-left: auto; color: #a08a67; font-size: 13px; letter-spacing: 4px;
             font-weight: 600; border: 1px solid rgba(160, 138, 103, .35);
             border-radius: 999px; padding: 6px 16px; }

  .mid { position: relative; z-index: 1; }
  .title-zh { color: #241a10; font-size: 46px; font-weight: 700;
              line-height: 1.28; letter-spacing: .5px; max-width: 620px;
              display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
              overflow: hidden; }
  .kicker { width: 46px; height: 6px; border-radius: 3px; background: {{accent}};
            margin-top: 16px; }

  .bottom { position: relative; z-index: 1; display: flex; align-items: flex-end;
            justify-content: space-between; gap: 24px; }
  .title-en { color: #8a755a; font-size: 17px; line-height: 1.5; max-width: 520px;
              letter-spacing: .2px;
              display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
              overflow: hidden; }
  .venue { flex-shrink: 0; color: #fffdf9; font-weight: 700; font-size: 18px;
           background: linear-gradient(135deg, #3d2c1a, #241a10);
           padding: 9px 22px; border-radius: 999px; letter-spacing: 1.5px;
           box-shadow: 0 6px 16px rgba(36, 26, 16, .24); }
  .venue:empty { display: none; }
</style>
</head>
<body>
<div class="stage">
  <div class="card">
    <div class="strip">
      <div class="dot"></div>
      <div class="vtag">{{kind_label}}</div>
      <div class="seam"></div>
    </div>
    <div class="body">
      <div class="ribbon"></div>
      <div class="ribbon2"></div>

      <div class="row">
        <div class="logo">链</div>
        <div class="name">供应链安全前沿</div>
        <div class="eyebrow">听会笔记</div>
      </div>

      <div class="mid">
        <div class="title-zh">{{title_zh}}</div>
        <div class="kicker"></div>
      </div>

      <div class="bottom">
        <div class="title-en">{{title_en}}</div>
        <div class="venue">{{venue}}</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
