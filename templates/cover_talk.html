<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 900px; height: 383px; overflow: hidden;
         font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
         -webkit-font-smoothing: antialiased; }

  /* 会议报告封面 A：冷灰蓝底 + 26px 圆角白卡 + 左侧竖排靛蓝标签条，
     和论文解读的深蓝满版底一眼区分开。 */
  .stage { position: relative; width: 900px; height: 383px;
           background: linear-gradient(155deg, #eef1f9 0%, #e6eaf6 52%, #dfe5f4 100%); }
  .stage::before { content: ""; position: absolute; right: -80px; top: -140px;
                   width: 460px; height: 460px; border-radius: 50%;
                   background: radial-gradient(circle, {{accent}} 0%, transparent 68%);
                   opacity: .16; }
  .stage::after { content: ""; position: absolute; left: -120px; bottom: -180px;
                  width: 420px; height: 420px; border-radius: 50%;
                  background: radial-gradient(circle, #38bdf8 0%, transparent 70%);
                  opacity: .10; }

  .card { position: absolute; inset: 16px; border-radius: 26px; overflow: hidden;
          background: linear-gradient(180deg, #ffffff 0%, #fcfdff 100%);
          border: 1px solid rgba(15, 23, 42, .07);
          box-shadow: 0 1px 2px rgba(15, 23, 42, .04),
                      0 10px 24px rgba(15, 23, 42, .07),
                      0 28px 60px rgba(15, 23, 42, .06);
          display: flex; }

  /* 左侧竖排标签条 */
  .strip { position: relative; flex-shrink: 0; width: 78px;
           background: linear-gradient(180deg, {{accent}} 0%, #3730a3 100%);
           display: flex; flex-direction: column; align-items: center;
           justify-content: center; gap: 18px; }
  .strip .dot { width: 10px; height: 10px; border-radius: 50%; background: #fff;
                box-shadow: 0 0 0 5px rgba(255, 255, 255, .22); }
  .strip .vtag { writing-mode: vertical-rl; color: #fff; font-size: 23px;
                 font-weight: 700; letter-spacing: 9px; text-indent: 9px; }
  .strip .seam { position: absolute; right: 0; top: 26px; bottom: 26px; width: 2px;
                 background: rgba(255, 255, 255, .22); border-radius: 2px; }

  .body { position: relative; flex: 1; padding: 30px 40px 28px 34px;
          display: flex; flex-direction: column; justify-content: space-between; }
  /* 卡内网格，右上浓、左下淡，避免和标题抢视线 */
  .body::before { content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(79, 70, 229, .10) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(79, 70, 229, .10) 1px, transparent 1px);
    background-size: 40px 40px;
    -webkit-mask-image: radial-gradient(120% 110% at 100% 0%, #000 0%, transparent 60%); }
  /* 装饰：三张叠起来的"幻灯片"，全圆角，收在右上角做配重 */
  .slides { position: absolute; right: 34px; top: 22px; width: 250px; height: 150px;
            transform: scale(.62); transform-origin: top right; }
  .slides i { position: absolute; display: block; border-radius: 14px;
              border: 2px solid {{accent}}; }
  .slides i:nth-child(1) { right: 34px; top: 0;  width: 196px; height: 118px; opacity: .16; }
  .slides i:nth-child(2) { right: 17px; top: 13px; width: 196px; height: 118px; opacity: .26; }
  .slides i:nth-child(3) { right: 0;  top: 26px; width: 196px; height: 118px; opacity: .42;
                           background: rgba(79, 70, 229, .05); }
  .slides b { position: absolute; display: block; height: 7px; border-radius: 4px;
              background: {{accent}}; opacity: .30; }
  .slides b:nth-of-type(1) { right: 24px; top: 52px; width: 148px; }
  .slides b:nth-of-type(2) { right: 24px; top: 70px; width: 118px; }
  .slides b:nth-of-type(3) { right: 24px; top: 88px; width: 84px; opacity: .18; }

  .row { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; }
  .logo { width: 32px; height: 32px; border-radius: 10px;
          background: linear-gradient(135deg, #36d399, #0ea5e9);
          display: flex; align-items: center; justify-content: center;
          color: #fff; font-size: 17px; font-weight: 700;
          box-shadow: 0 4px 10px rgba(14, 165, 233, .28); }
  .name { color: #475569; font-size: 17px; letter-spacing: 2.5px; font-weight: 500; }

  .mid { position: relative; z-index: 1; }
  .title-zh { color: #0f172a; font-size: 46px; font-weight: 700;
              line-height: 1.28; letter-spacing: .5px; max-width: 640px;
              display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
              overflow: hidden; }
  .kicker { width: 46px; height: 6px; border-radius: 3px; background: {{accent}};
            margin-top: 16px; }

  .bottom { position: relative; z-index: 1; display: flex; align-items: flex-end;
            justify-content: space-between; gap: 24px; }
  .title-en { color: #64748b; font-size: 17px; line-height: 1.5; max-width: 520px;
              letter-spacing: .2px;
              display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
              overflow: hidden; }
  .venue { flex-shrink: 0; color: #ffffff; font-weight: 700; font-size: 18px;
           background: linear-gradient(135deg, #1e293b, #0f172a);
           padding: 9px 22px; border-radius: 999px; letter-spacing: 1.5px;
           box-shadow: 0 6px 16px rgba(15, 23, 42, .22); }
  .venue:empty { display: none; }
</style>
</head>
<body>
<div class="stage">
  <div class="card">
    <div class="strip">
      <div class="dot"></div>
      <div class="vtag">{{kind_label}}</div>
      <div class="seam"></div>
    </div>
    <div class="body">
      <div class="slides">
        <i></i><i></i><i></i>
        <b></b><b></b><b></b>
      </div>

      <div class="row">
        <div class="logo">链</div>
        <div class="name">供应链安全前沿</div>
      </div>

      <div class="mid">
        <div class="title-zh">{{title_zh}}</div>
        <div class="kicker"></div>
      </div>

      <div class="bottom">
        <div class="title-en">{{title_en}}</div>
        <div class="venue">{{venue}}</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
